<!doctype html><meta charset=utf-8>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<body style="margin:0;background:#000">
<script>
const W=1080,H=1350,M=84;
const FONT='Inter, system-ui, -apple-system, "Segoe UI", sans-serif';
const INK='#0F1B33';
const GSTOPS=[[0,'#4338CA'],[.3,'#14B8A6'],[.6,'#FB7185'],[.8,'#A855F7'],[1,'#F2B134']];
function grad(ctx,x0,y0,x1,y1,stops=GSTOPS){const g=ctx.createLinearGradient(x0,y0,x1,y1);stops.forEach(([s,c])=>g.addColorStop(s,c));return g}
const GOLD=[[0,'#FEF3C7'],[.35,'#FCD34D'],[.7,'#F59E0B'],[1,'#B45309']];
const PURPLE=[[0,'#DDD6FE'],[.4,'#A78BFA'],[.75,'#7C3AED'],[1,'#4C1D95']];
const NAVY=[[0,'#3730A3'],[1,'#1E1B4B']];
const HOLO=[[0,'#FBCFE8'],[.3,'#A5F3FC'],[.55,'#C7D2FE'],[.8,'#F5D0FE'],[1,'#BAE6FD']];
const ROSE=[[0,'#FECDD3'],[.5,'#FB7185'],[1,'#E11D48']];
function wrap(ctx,t,w){const out=[];let cur='';for(const word of t.split(' ')){const tr=cur?cur+' '+word:word;if(ctx.measureText(tr).width>w&&cur){out.push(cur);cur=word}else cur=tr}if(cur)out.push(cur);return out}
function fit(ctx,text,w,h,{max=72,min=38,lh=1.22,weight=700}){
  text=(text||'').trim().replace(/\s+/g,' ');
  for(let s=max;s>=min;s-=2){ctx.font=`${weight} ${s}px ${FONT}`;const lines=wrap(ctx,text,w);if(lines.length*s*lh<=h) return {size:s,lines};}
  ctx.font=`${weight} ${min}px ${FONT}`;let lines=wrap(ctx,text,w);const n=Math.max(1,Math.floor(h/(min*lh)));
  if(lines.length<=n) return {size:min,lines};
  lines=lines.slice(0,n);let last=lines[n-1];while(last&&ctx.measureText(last+'…').width>w) last=last.slice(0,-1).trimEnd();
  lines[n-1]=last+'…';return {size:min,lines};
}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function tracked(ctx,t,x,y,sp,align='left'){ctx.letterSpacing=sp+'px';ctx.textAlign=align;ctx.fillText(t,x,y);ctx.letterSpacing='0px';ctx.textAlign='left'}
function meshBg(ctx){
  const g=ctx.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'#1A1140');g.addColorStop(.35,'#122A4A');g.addColorStop(.62,'#0E2E3C');g.addColorStop(.82,'#2B1B3E');g.addColorStop(1,'#3A1F2E');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  [[180,220,520,'67,56,202',.55],[920,380,560,'20,184,166',.40],[760,1200,620,'251,113,133',.35],[150,1180,500,'168,85,247',.30]].forEach(([x,y,r,c,a])=>{
    const rg=ctx.createRadialGradient(x,y,0,x,y,r);rg.addColorStop(0,`rgba(${c},${a})`);rg.addColorStop(1,`rgba(${c},0)`);ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);});
}
function glassPanel(ctx,x,y,w,h,r=32){
  ctx.save();ctx.shadowColor='rgba(0,0,0,.45)';ctx.shadowBlur=40;ctx.shadowOffsetY=18;
  rr(ctx,x,y,w,h,r);ctx.fillStyle='rgba(8,10,22,.72)';ctx.fill();ctx.restore();
  rr(ctx,x,y,w,h,r);ctx.save();ctx.clip();
  const hl=ctx.createLinearGradient(x,y,x,y+60);hl.addColorStop(0,'rgba(255,255,255,.14)');hl.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=hl;ctx.fillRect(x,y,w,60);ctx.restore();
  rr(ctx,x+1,y+1,w-2,h-2,r-1);ctx.strokeStyle='rgba(255,255,255,.10)';ctx.lineWidth=1;ctx.stroke();
}

/* ---------------- badge primitives ---------------- */
function starPath(ctx,cx,cy,ro,ri,n,rot=-Math.PI/2){ctx.beginPath();for(let i=0;i<n*2;i++){const r=i%2?ri:ro,a=rot+i*Math.PI/n;const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath()}
function roundStar(ctx,cx,cy,ro,ri,n,rot=-Math.PI/2){ // soft scalloped burst
  ctx.beginPath();for(let i=0;i<=n*2;i++){const a=rot+i*Math.PI/n,r=i%2?ri:ro;const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;
    if(!i){ctx.moveTo(x,y);continue}const am=rot+(i-.5)*Math.PI/n,rm=(i%2?ro:ri)*.5+(i%2?ri:ro)*.5;
    ctx.quadraticCurveTo(cx+Math.cos(am)*rm*1.02,cy+Math.sin(am)*rm*1.02,x,y)}ctx.closePath()}
function shieldPath(ctx,cx,cy,w,h){const t=cy-h/2,b=cy+h/2;ctx.beginPath();ctx.moveTo(cx,t);
  ctx.quadraticCurveTo(cx+w*.28,t+h*.10,cx+w/2,t+h*.06);ctx.lineTo(cx+w/2,cy+h*.02);
  ctx.quadraticCurveTo(cx+w/2,b-h*.18,cx,b);ctx.quadraticCurveTo(cx-w/2,b-h*.18,cx-w/2,cy+h*.02);
  ctx.lineTo(cx-w/2,t+h*.06);ctx.quadraticCurveTo(cx-w*.28,t+h*.10,cx,t);ctx.closePath()}
function heartPath(ctx,cx,cy,s){ctx.beginPath();ctx.moveTo(cx,cy+s*.75);
  ctx.bezierCurveTo(cx-s*1.1,cy+s*.05,cx-s*.75,cy-s*.85,cx,cy-s*.3);
  ctx.bezierCurveTo(cx+s*.75,cy-s*.85,cx+s*1.1,cy+s*.05,cx,cy+s*.75);ctx.closePath()}
function crownPath(ctx,cx,cy,s){ctx.beginPath();ctx.moveTo(cx-s,cy+s*.55);ctx.lineTo(cx-s*1.05,cy-s*.45);ctx.lineTo(cx-s*.5,cy);
  ctx.lineTo(cx,cy-s*.7);ctx.lineTo(cx+s*.5,cy);ctx.lineTo(cx+s*1.05,cy-s*.45);ctx.lineTo(cx+s,cy+s*.55);ctx.closePath()}
function checkStroke(ctx,cx,cy,s,col='#fff',lw){ctx.save();ctx.strokeStyle=col;ctx.lineWidth=lw||s*.28;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(cx-s*.55,cy+s*.02);ctx.lineTo(cx-s*.15,cy+s*.42);ctx.lineTo(cx+s*.6,cy-s*.4);ctx.stroke();ctx.restore()}
function gloss(ctx,cx,cy,rx,ry,a=.35){ctx.save();const g=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(rx,ry));
  g.addColorStop(0,`rgba(255,255,255,${a})`);g.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(cx,cy,rx,ry,-.5,0,7);ctx.fill();ctx.restore()}
function sparkle(ctx,x,y,s,col='#fff'){ctx.save();ctx.fillStyle=col;ctx.shadowColor=col;ctx.shadowBlur=s*1.5;
  ctx.beginPath();ctx.moveTo(x,y-s);ctx.quadraticCurveTo(x,y,x+s,y);ctx.quadraticCurveTo(x,y,x,y+s);ctx.quadraticCurveTo(x,y,x-s,y);ctx.quadraticCurveTo(x,y,x,y-s);ctx.fill();ctx.restore()}
function wing(ctx,cx,cy,s,dir,stops){ // fan of three teardrop feathers attached at the base
  const fan=[[-.55,1.0],[-.12,.86],[.3,.7]];
  fan.forEach(([rot,len],i)=>{ctx.save();ctx.translate(cx,cy+(i-1)*s*.12);ctx.rotate(dir*rot);
    const L=s*len,T=s*.24;ctx.beginPath();ctx.moveTo(0,-T*.5);
    ctx.bezierCurveTo(dir*L*.45,-T*1.1,dir*L*.95,-T*.5,dir*L,0);
    ctx.bezierCurveTo(dir*L*.9,T*.55,dir*L*.4,T*.8,0,T*.5);ctx.closePath();
    ctx.fillStyle=grad(ctx,0,-T,dir*L,T,stops);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=2;ctx.stroke();ctx.restore()});
}
function dropShadow(ctx,fn){ctx.save();ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=24;ctx.shadowOffsetY=10;fn();ctx.restore()}

/* ---------------- the five badges ---------------- */
// 1 Who it's for: laurel wreath + crown
function badgeLaurel(ctx,cx,cy,r){
  dropShadow(ctx,()=>{ctx.beginPath();ctx.arc(cx,cy,r*.62,0,7);ctx.fillStyle=grad(ctx,cx,cy-r,cx,cy+r,NAVY);ctx.fill()});
  ctx.beginPath();ctx.arc(cx,cy,r*.62,0,7);ctx.lineWidth=r*.07;ctx.strokeStyle=grad(ctx,cx-r,cy-r,cx+r,cy+r,GOLD);ctx.stroke();
  for(const d of[-1,1])for(let i=0;i<7;i++){const a=Math.PI/2+d*(.38+i*.34),x=cx+Math.cos(a)*r*.8,y=cy+Math.sin(a)*r*.8;
    ctx.save();ctx.translate(x,y);ctx.rotate(a+d*Math.PI/2.6);ctx.beginPath();ctx.ellipse(0,0,r*.16,r*.085,0,0,7);
    ctx.fillStyle=grad(ctx,-r*.15,0,r*.15,0,GOLD);ctx.fill();ctx.restore()}
  crownPath(ctx,cx,cy+r*.04,r*.3);ctx.fillStyle=grad(ctx,cx,cy-r*.3,cx,cy+r*.25,GOLD);ctx.fill();
  for(const dx of[-1,0,1]){ctx.beginPath();ctx.arc(cx+dx*r*.31,cy+r*.04-(dx?r*.14:r*.21),r*.045,0,7);ctx.fillStyle='#FEF3C7';ctx.fill()}
  gloss(ctx,cx-r*.22,cy-r*.3,r*.3,r*.16,.22);
}
// 2 The pain: winged shield with a heart
function badgeHeartShield(ctx,cx,cy,r){
  wing(ctx,cx-r*.34,cy-r*.08,r*.78,-1,GOLD);wing(ctx,cx+r*.34,cy-r*.08,r*.78,1,GOLD);
  dropShadow(ctx,()=>{shieldPath(ctx,cx,cy,r*1.0,r*1.2);ctx.fillStyle=grad(ctx,cx-r,cy-r,cx+r,cy+r,GOLD);ctx.fill()});
  shieldPath(ctx,cx,cy+r*.02,r*.8,r*.98);ctx.fillStyle=grad(ctx,cx,cy-r,cx,cy+r,NAVY);ctx.fill();
  heartPath(ctx,cx,cy+r*.02,r*.3);ctx.fillStyle=grad(ctx,cx-r*.3,cy-r*.3,cx+r*.3,cy+r*.3,ROSE);ctx.fill();
  gloss(ctx,cx-r*.1,cy-r*.08,r*.1,r*.06,.6);
  gloss(ctx,cx-r*.18,cy-r*.35,r*.25,r*.12,.2);
}
// 3 Critical & blatant: purple starburst with a check
function badgeBurst(ctx,cx,cy,r){
  dropShadow(ctx,()=>{roundStar(ctx,cx,cy,r*.82,r*.64,10);ctx.fillStyle=grad(ctx,cx-r,cy-r,cx+r,cy+r,PURPLE);ctx.fill()});
  roundStar(ctx,cx,cy,r*.82,r*.64,10);ctx.lineWidth=3;ctx.strokeStyle='rgba(255,255,255,.35)';ctx.stroke();
  gloss(ctx,cx-r*.25,cy-r*.3,r*.38,r*.2,.4);
  checkStroke(ctx,cx,cy+r*.03,r*.42);
}
// 4 Before & after: winged trophy emblem
function badgeTrophy(ctx,cx,cy,r){
  wing(ctx,cx-r*.42,cy,r*.74,-1,PURPLE);wing(ctx,cx+r*.42,cy,r*.74,1,PURPLE);
  const hex=(s)=>{ctx.beginPath();for(let i=0;i<6;i++){const a=Math.PI/6+i*Math.PI/3;const x=cx+Math.cos(a)*s,y=cy+Math.sin(a)*s;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath()};
  dropShadow(ctx,()=>{hex(r*.6);ctx.fillStyle=grad(ctx,cx-r,cy-r,cx+r,cy+r,PURPLE);ctx.fill()});
  ctx.lineJoin='round';hex(r*.6);ctx.lineWidth=r*.06;ctx.strokeStyle='#C4B5FD';ctx.stroke();
  hex(r*.47);ctx.fillStyle=grad(ctx,cx,cy-r,cx,cy+r,NAVY);ctx.fill();
  const s=r*.26,g=grad(ctx,cx,cy-s,cx,cy+s,GOLD);ctx.fillStyle=g;ctx.strokeStyle=g;
  ctx.beginPath();ctx.moveTo(cx-s*.7,cy-s*.75);ctx.lineTo(cx+s*.7,cy-s*.75);ctx.quadraticCurveTo(cx+s*.7,cy+s*.2,cx,cy+s*.25);ctx.quadraticCurveTo(cx-s*.7,cy+s*.2,cx-s*.7,cy-s*.75);ctx.fill();
  ctx.lineWidth=s*.16;for(const d of[-1,1]){ctx.beginPath();ctx.moveTo(cx+d*s*.68,cy-s*.55);ctx.quadraticCurveTo(cx+d*s*1.15,cy-s*.55,cx+d*s*.6,cy-s*.05);ctx.stroke()}
  ctx.fillRect(cx-s*.1,cy+s*.2,s*.2,s*.35);rr(ctx,cx-s*.45,cy+s*.52,s*.9,s*.22,s*.06);ctx.fill();
  gloss(ctx,cx-r*.18,cy-r*.28,r*.25,r*.12,.25);
}
// 5 Pitch: ribbon medal with a gold star
function badgeMedal(ctx,cx,cy,r){
  for(const d of[-1,1]){ctx.save();ctx.translate(cx+d*r*.2,cy+r*.35);ctx.rotate(d*.22);
    ctx.beginPath();ctx.moveTo(-r*.17,0);ctx.lineTo(r*.17,0);ctx.lineTo(r*.17,r*.62);ctx.lineTo(0,r*.5);ctx.lineTo(-r*.17,r*.62);ctx.closePath();
    ctx.fillStyle=grad(ctx,0,0,0,r*.6,[[0,'#818CF8'],[1,'#4338CA']]);ctx.fill();ctx.restore()}
  dropShadow(ctx,()=>{roundStar(ctx,cx,cy-r*.08,r*.6,r*.54,14);ctx.fillStyle=grad(ctx,cx-r,cy-r,cx+r,cy+r,[[0,'#C7D2FE'],[.5,'#818CF8'],[1,'#4338CA']]);ctx.fill()});
  ctx.beginPath();ctx.arc(cx,cy-r*.08,r*.42,0,7);ctx.fillStyle=grad(ctx,cx,cy-r*.5,cx,cy+r*.4,[[0,'#6366F1'],[1,'#312E81']]);ctx.fill();
  ctx.lineWidth=3;ctx.strokeStyle='rgba(255,255,255,.35)';ctx.stroke();
  starPath(ctx,cx,cy-r*.07,r*.27,r*.12,5);ctx.fillStyle=grad(ctx,cx,cy-r*.35,cx,cy+r*.2,GOLD);ctx.fill();
  gloss(ctx,cx-r*.15,cy-r*.3,r*.25,r*.12,.3);
}
// 1 Who it's for: heart medallion with gold feathered wings
function badgeHeartMedallion(ctx,cx,cy,r){
  wing(ctx,cx-r*.42,cy-r*.06,r*.78,-1,GOLD);wing(ctx,cx+r*.42,cy-r*.06,r*.78,1,GOLD);
  dropShadow(ctx,()=>{ctx.beginPath();ctx.arc(cx,cy,r*.58,0,7);ctx.fillStyle=grad(ctx,cx-r,cy-r,cx+r,cy+r,GOLD);ctx.fill()});
  ctx.beginPath();ctx.arc(cx,cy,r*.48,0,7);ctx.fillStyle=grad(ctx,cx,cy-r,cx,cy+r,NAVY);ctx.fill();
  heartPath(ctx,cx,cy+r*.03,r*.4);ctx.fillStyle=grad(ctx,cx-r*.4,cy-r*.4,cx+r*.4,cy+r*.4,ROSE);ctx.fill();
  gloss(ctx,cx-r*.14,cy-r*.1,r*.12,r*.07,.6);gloss(ctx,cx-r*.2,cy-r*.3,r*.28,r*.13,.2);
}
// 2 The pain: gold-rimmed shield with a gradient fill
function badgeShield(ctx,cx,cy,r){
  dropShadow(ctx,()=>{shieldPath(ctx,cx,cy,r*1.0,r*1.2);ctx.fillStyle=grad(ctx,cx-r,cy-r,cx+r,cy+r,GOLD);ctx.fill()});
  shieldPath(ctx,cx,cy+r*.02,r*.8,r*.98);
  ctx.fillStyle=grad(ctx,cx-r*.4,cy-r*.5,cx+r*.4,cy+r*.5,[[0,'#6366F1'],[.35,'#14B8A6'],[.7,'#FB7185'],[1,'#A855F7']]);ctx.fill();
  gloss(ctx,cx-r*.18,cy-r*.32,r*.26,r*.13,.35);
}
const BADGES={1:badgeHeartMedallion,2:badgeShield,3:badgeBurst,4:badgeLaurel,5:badgeMedal};
function sticker(ctx,n,cx,cy,r,rot=.12){ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);BADGES[n](ctx,0,0,r);ctx.restore()}

/* ---------------- progress pill: glowing segmented dots ---------------- */
function progressPill(ctx,n,xRight,cy){
  const dots=5,gap=36,dr=9,pw=dots*gap+28,ph=46,x=xRight-pw,y=cy-ph/2;
  rr(ctx,x,y,pw,ph,ph/2);ctx.fillStyle='rgba(10,12,30,.75)';ctx.fill();
  rr(ctx,x,y,pw,ph,ph/2);ctx.lineWidth=2.5;ctx.strokeStyle=grad(ctx,x,0,x+pw,0,[[0,'#818CF8'],[.5,'#5EEAD4'],[1,'#C084FC']]);ctx.stroke();
  for(let i=1;i<=dots;i++){const dx=x+14+gap/2+(i-1)*gap;
    if(i<n){ctx.save();ctx.shadowColor='#5EEAD4';ctx.shadowBlur=14;ctx.beginPath();ctx.arc(dx,cy,dr,0,7);ctx.fillStyle='#6EE7B7';ctx.fill();ctx.restore()}
    else if(i===n){ctx.save();ctx.shadowColor='#F0ABFC';ctx.shadowBlur=20;ctx.beginPath();ctx.arc(dx,cy,dr+3,0,7);
      ctx.fillStyle=grad(ctx,dx-12,cy-12,dx+12,cy+12,[[0,'#A5F3FC'],[.5,'#C4B5FD'],[1,'#F9A8D4']]);ctx.fill();ctx.restore();
      sparkle(ctx,dx-3,cy-3,4.5,'#fff')}
    else{ctx.beginPath();ctx.arc(dx,cy,dr-1,0,7);ctx.fillStyle='rgba(255,255,255,.16)';ctx.fill()}}
}
function frame(ctx,n,label,footer='Alex Rivera'){
  meshBg(ctx);
  ctx.fillStyle='#fff';ctx.font=`800 30px ${FONT}`;tracked(ctx,label.toUpperCase(),M,128,5);
  progressPill(ctx,n,W-M,118);
  ctx.fillStyle='rgba(255,255,255,.65)';ctx.font=`500 26px ${FONT}`;ctx.textAlign='right';ctx.fillText(footer,W-M,H-90);ctx.textAlign='left';
}

/* ---------------- cards ---------------- */
function card3(ctx,d){
  frame(ctx,3,'Critical & Blatant');
  const mx=M,my=200,mw=W-2*M,mh=620,hw=mw/2,hh=mh/2;
  [['CRITICAL · LATENT',0,0,0],['CRITICAL · BLATANT',1,0,1],['ASPIRATIONAL · LATENT',0,1,0],['ASPIRATIONAL · BLATANT',1,1,0]].forEach(([name,qx,qy,hi])=>{
    const x=mx+qx*hw+(qx?6:0),y=my+qy*hh+(qy?6:0),w=hw-6,h=hh-6;glassPanel(ctx,x,y,w,h,24);
    if(hi){rr(ctx,x+1,y+1,w-2,h-2,23);ctx.save();ctx.clip();const g=ctx.createLinearGradient(x,y,x+w,y+h);g.addColorStop(0,'rgba(67,56,202,.35)');g.addColorStop(1,'rgba(20,184,166,.35)');ctx.fillStyle=g;ctx.fillRect(x,y,w,h);ctx.restore()}
    ctx.fillStyle=hi?'#5EEAC4':'rgba(255,255,255,.55)';ctx.font=`800 24px ${FONT}`;tracked(ctx,name,x+34,y+h-34,3)});
  const px=mx+d.x/100*mw,py=my+d.y/100*mh;
  ctx.fillStyle=grad(ctx,px-46,0,px+46,0);ctx.globalAlpha=.35;ctx.beginPath();ctx.arc(px,py,50,0,7);ctx.fill();ctx.globalAlpha=1;
  ctx.fillStyle=grad(ctx,px-26,0,px+26,0);ctx.beginPath();ctx.arc(px,py,26,0,7);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=6;ctx.stroke();
  const vy=880;glassPanel(ctx,M,vy,W-2*M,320,28);
  ctx.fillStyle=grad(ctx,M+48,0,M+460,0);ctx.font=`800 28px ${FONT}`;tracked(ctx,'WHERE THIS LANDS',M+48,vy+66,5);
  ctx.fillStyle='#fff';ctx.font=`800 70px ${FONT}`;ctx.fillText('Critical & Blatant',M+48,vy+150);
  const n=fit(ctx,d.need,W-2*M-96,110,{max:38,min:30,weight:500,lh:1.3});
  ctx.fillStyle='rgba(255,255,255,.85)';ctx.font=`500 ${n.size}px ${FONT}`;n.lines.forEach((l,i)=>ctx.fillText(l,M+48,vy+190+n.size*1.3*i+n.size));
  sticker(ctx,3,W-M-40,vy+20,78,.14);
}
function card4(ctx,d){
  frame(ctx,4,'Before & After');
  const pw=W-2*M,pad=64,py=200,h1=440,h2=470;
  glassPanel(ctx,M,py,pw,h1);
  ctx.fillStyle=grad(ctx,M+pad,0,M+pad+36,0);ctx.beginPath();ctx.arc(M+pad+18,py+pad+14,18,0,7);ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(M+pad+11,py+pad+7);ctx.lineTo(M+pad+25,py+pad+21);ctx.moveTo(M+pad+25,py+pad+7);ctx.lineTo(M+pad+11,py+pad+21);ctx.stroke();
  ctx.fillStyle='#fff';ctx.font=`800 28px ${FONT}`;tracked(ctx,'BEFORE',M+pad+52,py+pad+24,5);
  {ctx.font=`800 28px ${FONT}`;const w=ctx.measureText('BEFORE').width+6*5;ctx.font=`500 28px ${FONT}`;ctx.fillStyle='rgba(255,255,255,.6)';ctx.fillText('(Current Pain)',M+pad+52+w+8,py+pad+24)}
  let b=fit(ctx,d.before,pw-2*pad,h1-130-50,{max:56,min:34,weight:600});
  ctx.fillStyle='rgba(255,255,255,.92)';ctx.font=`600 ${b.size}px ${FONT}`;b.lines.forEach((l,i)=>ctx.fillText(l,M+pad,py+130+b.size*1.22*i+b.size));
  const seamY=py+h1+30,ay=seamY+30;
  glassPanel(ctx,M,ay,pw,h2);
  ctx.fillStyle=grad(ctx,M+pad,0,M+pad+36,0);ctx.beginPath();ctx.arc(M+pad+18,ay+pad+14,18,0,7);ctx.fill();
  ctx.strokeStyle=INK;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(M+pad+9,ay+pad+14);ctx.lineTo(M+pad+16,ay+pad+21);ctx.lineTo(M+pad+28,ay+pad+8);ctx.stroke();
  ctx.fillStyle=grad(ctx,M+pad+52,0,M+pad+300,0);ctx.font=`800 28px ${FONT}`;tracked(ctx,'AFTER',M+pad+52,ay+pad+24,5);
  {ctx.font=`800 28px ${FONT}`;const w=ctx.measureText('AFTER').width+5*5;ctx.font=`500 28px ${FONT}`;ctx.fillStyle='rgba(255,255,255,.6)';ctx.fillText('(Future Gain)',M+pad+52+w+8,ay+pad+24)}
  let a=fit(ctx,d.after,pw-2*pad,h2-130-50,{max:56,min:34,weight:700});
